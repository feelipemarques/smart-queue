@if(counterId == ''){
    <button (click)="openCounter()">Open Counter</button>
    <p>You're not assigned to a counter. Please create one!</p>
}@else {
    <p>Your counter: {{counterId}}</p>
    <p>You're {{counterStatus ? 'online' : 'offline'}}</p>
    <button (click)="changeCounterStatus()">Change Status</button>
}

@for (ticket of tickets; track $index) {
    <p>{{ticket.number}} - {{ticket.issuedAt}}</p>
}
